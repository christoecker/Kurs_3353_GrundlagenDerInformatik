name: Kurswebseite bauen und veröffentlichen

on:
  push:
    branches: [main]
  # Täglicher Rebuild, damit Seiten mit "publish_date" am Stichtag
  # automatisch erscheinen, ohne dass dafür erneut gepusht werden muss
  # (siehe hooks/publish_scheduler.py). 04:15 UTC ~ 05:15/06:15 lokal.
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

# "mkdocs gh-deploy" committet das gebaute Ergebnis in den gh-pages-Branch,
# braucht dafür also Schreibrecht auf den Repository-Inhalt. In den
# Repo-Settings ist entsprechend "Pages -> Source: Deploy from a branch"
# mit Branch "gh-pages" / "(root)" eingestellt — genau wie beim
# Datenbanken-Kurs (Kurs 3019).
permissions:
  contents: write

# Verhindert, dass zwei Läufe (z. B. Push und Cron) gleichzeitig auf
# gh-pages pushen wollen.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      # ghp-import (von gh-deploy genutzt) erzeugt einen echten Commit und
      # braucht dafür eine Git-Identität — auf dem Runner ist keine gesetzt.
      - name: Git-Identität setzen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # MKDOCS_TESTMODE wird hier bewusst NICHT gesetzt: Die öffentliche
      # Seite filtert immer normal nach publish_date. Der Testmodus ist
      # ausschließlich für lokales "mkdocs serve" gedacht (siehe CLAUDE.md).
      # --strict lässt den Lauf bei Warnungen (z. B. kaputten Links oder
      # fehlenden Snippet-Pfaden) hart fehlschlagen, statt eine defekte
      # Seite zu veröffentlichen.
      - name: Seite bauen und nach gh-pages veröffentlichen
        run: mkdocs gh-deploy --strict --force
